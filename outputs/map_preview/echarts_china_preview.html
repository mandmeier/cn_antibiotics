<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECharts China Map Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1f2933;
      --muted: #5f6c7b;
      --accent: #b5502e;
      --border: #d8cfc2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(181, 80, 46, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(29, 78, 137, 0.14), transparent 24%),
        var(--bg);
    }

    .wrap {
      width: min(1280px, calc(100vw - 32px));
      margin: 20px auto;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    #chart {
      width: 100%;
      height: min(78vh, 920px);
      min-height: 720px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #fbfaf7 0%, #f7f4ee 100%);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ECharts China Map Preview</h1>
    <p>
      Local preview using the downloaded ECharts runtime and <code>china.js</code> map asset.
      This lets you inspect the full map extent, including Taiwan as rendered by the packaged China map.
    </p>
    <div id="chart" aria-label="China map preview"></div>
  </main>

  <script src="../../data/raw/maps/echarts.min.js"></script>
  <script src="../../data/raw/maps/echarts_china.js"></script>
  <script>
    const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });

    chart.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: params => params.name || 'China'
      },
      graphic: [
        {
          type: 'text',
          left: 24,
          top: 22,
          style: {
            text: 'Full ECharts china.js base map',
            fill: '#1f2933',
            font: '600 18px Georgia'
          }
        }
      ],
      series: [
        {
          type: 'map',
          map: 'china',
          roam: true,
          zoom: 1,
          left: '6%',
          right: '6%',
          top: '8%',
          bottom: '5%',
          label: {
            show: false,
            color: '#273444'
          },
          emphasis: {
            label: {
              show: true,
              color: '#102a43'
            },
            itemStyle: {
              areaColor: '#f3c873'
            }
          },
          itemStyle: {
            areaColor: '#eadfcd',
            borderColor: '#7b8fb3',
            borderWidth: 1
          }
        }
      ]
    });

    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
